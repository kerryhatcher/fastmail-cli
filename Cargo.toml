[package]
name = "fastmail-cli"
version = "2.0.1"
edition = "2024"
description = "CLI for Fastmail's JMAP API"
repository = "https://github.com/radiosilence/fastmail-cli"
license = "MIT"
keywords = ["cli", "email", "fastmail", "jmap"]
categories = ["command-line-utilities", "email"]

[lib]
name = "fastmail_cli"
path = "src/lib.rs"

[[bin]]
name = "fastmail-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
dirs = "6.0.0"
futures = "0.3"
image = { version = "0.25", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "webp"
] }
kreuzberg = { version = "~4.4", optional = true, features = [
  "archives",
  "bundled-pdfium",
  "email",
  "excel",
  "html",
  "language-detection",
  "office",
  "pdf",
  "xml"
] }
async-graphql = "7"
reqwest = { version = "0.13.1", default-features = false, features = [
  "json",
  "rustls"
] }
rmcp = { version = "0.12", features = ["server", "transport-io"] }
schemars = "0.8"
secrecy = { version = "^0.10", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
# PERF-11: narrowed from "full"; see Phase 15-04 SUMMARY for verification
tokio = { version = "1.49.0", features = ["rt-multi-thread", "rt", "macros", "io-util", "sync", "time", "signal", "net"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
roxmltree = "0.21.1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2.3"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.9", features = ["os_rng"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["extract"]
extract = ["dep:kreuzberg"]

[profile.release]
strip = true
lto = true
codegen-units = 1
